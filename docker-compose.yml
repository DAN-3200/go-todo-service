services:
  api:
    image: todo_api_img
    container_name: todo_api
    build: .
    restart: always
    env_file:
      - .env
    networks:
      - todo_net
    depends_on:
      - database
    expose:
      - 8080

  database:
    image: postgres:latest
    container_name: todo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5800:5432
    volumes:
      - todo_data:/var/lib/postgress/data
    networks:
      - todo_net

volumes:
  todo_data:

networks:
  todo_net:
    driver: bridge
